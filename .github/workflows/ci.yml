name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests and artifact checksums
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / "default.manifest.json").read_text())
          for section in ("inputs", "outputs"):
              for relative_path, expected in manifest[section].items():
                  path = root / relative_path
                  if section == "inputs" and not path.exists():
                      continue
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(f"checksum mismatch: {relative_path}")

          for path in root.rglob("*.json"):
              json.loads(path.read_text())
